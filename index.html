<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 6</title>
    <link rel="stylesheet" href="Actividad_6.css">
    <link rel="icon" type="image/svg+xml" href="noelizz.svg">
  <link rel="alternate icon" href="favicon.ico">
</head>
<body>
<h1>Calculadora de IMC</h1>
<div>
    <h1>Ingrese su peso en kg</h1>
    <input id="peso" type="number">
    <h1>Ingrese su altura en metros</h1>
    <input id="altura" type="number">
    <button onclick="
    let peso = document.querySelector('#peso').value
    let altura = document.querySelector('#altura').value
    let imc = peso / (altura * altura)
    let resultado = peso / (altura * altura)
    if (resultado < 18.5){
        document.querySelector('#holajaja').innerHTML = 'Su IMC es: ' + imc + ' y su peso es bajo'
    }
    else if(resultado < 24.9){
        document.querySelector('#holajaja').innerHTML = 'Su IMC es: ' + imc + ' y su peso es normal'
    }
    else if(resultado >= 25){
        document.querySelector('#holajaja').innerHTML = 'Su IMC es: ' + imc + ' y su peso es sobrepeso'
    }
    document.querySelector('#needle').style.left = 'calc(' + Math.min(Math.max((resultado - 15) / 25 * 100, 0), 100) + '% - 1px)'
    "> Verificar </button>
    <h1 id="holajaja">Verificacion </h1>
    <div class="scale"><div class="needle" id="needle"></div></div>
    <div class="scale-labels">
        <span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span>
    </div>
</div>
<footer><img src="noelizz.svg" alt="footer logo" width="40%" ></footer>
</body>
</html>
